# The data pipeline playground (#115), opt-in: everyday development is ./start.sh and does not use this
# file. Every service has a profile, and `full` has them all:
#
#   docker compose -f docker-compose.cdc.yml --profile infra --profile cdc up -d   # PostgreSQL, Kafka, Kafka Connect
#   docker compose -f docker-compose.cdc.yml --profile full up -d --build          # the same plus Rio's backend
#   docker compose -f docker-compose.cdc.yml --profile '*' down                    # stop and remove all of it
#
# A command that names neither a profile nor a service skips every service here: a bare `down` exits 0
# and leaves everything running. `down` keeps the volumes, so the next `up` resumes where it stopped;
# `down -v` resets Rio's data and Kafka together.
#
# A service's depends_on targets are in every profile the service is in (so `kafka` is in `cdc`):
# Compose rejects the whole project, for every command, when an active service depends on an inactive
# one. Each profile, and so any combination of them, is then a valid project; ./verify.sh checks it.
#
# Needs Docker Compose 2.20.2 or later, the first to accept `start_interval`. Docker Engine older than 25
# ignores that setting, so Kafka and Connect report healthy up to 30 s later.
#
# In `full`, the UI still runs on the host: `cd frontend && pnpm run dev`, whose proxy sends /api to :8080.
# postgres-rio and ./start.sh's rio-postgres both publish 127.0.0.1:5432, and rio-backend and ./start.sh's
# backend both use :8080, so run one setup at a time (./stop.sh first). Every port is published on
# 127.0.0.1 only: none of these services authenticates, and Connect's REST API accepts any connector.

# Fixed, so container and volume names don't depend on the checkout directory's name.
name: rio-cdc

services:
  postgres-rio:
    # The same image as ./start.sh and the backend tests (PostgresTestDatabase); bump them together.
    image: postgres:17
    profiles: [infra, full]
    # wal_level=logical lets Debezium decode the WAL through pgoutput.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: rio
      POSTGRES_PASSWORD: rio
      POSTGRES_DB: rio
    ports:
      - "127.0.0.1:5432:5432"   # for a backend run on the host, as with ./start.sh
    volumes:
      # Not ./start.sh's rio-postgres-data: Debezium's replication slot lives in this database and keeps
      # WAL until it is consumed, which nothing does during everyday development.
      - postgres-rio-data:/var/lib/postgresql/data
      # The CDC role, grants and publication; the image runs it only on an empty volume.
      - ./docker/postgres-rio/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP: while it initializes an empty volume, the image runs a temporary server that listens
      # on the socket only and is then restarted.
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "rio", "-d", "rio"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.3.1
    profiles: [infra, cdc, full]
    environment:
      # One node that is both broker and KRaft controller; there is no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for other containers (kafka:29092), EXTERNAL for clients on the host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Setting any KAFKA_ variable replaces the image's default server.properties, so the single-broker
      # settings for internal topics (replication factor 3 and min ISR 2 by default) have to be restated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The volume is formatted for this id and refuses any other. The image's default is a fixed id too,
      # but it is the image's to change, and an image bump that changed it would lock out the volume.
      CLUSTER_ID: 7qizwwLGRlacX1iBY-YpmQ
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      # Connect keeps connector configs and offsets in Kafka topics. They persist like postgres-rio's
      # replication slot, so a `down` and `up` resumes streaming instead of orphaning the slot.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Each run starts a JVM, about 2 s of CPU: every 2 s until the first success, then every 30 s.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 10s
      retries: 3

  kafka-connect:
    # Kafka Connect 4.3 with the Debezium connectors, the PostgreSQL one included.
    image: quay.io/debezium/connect:3.6.3.Final
    profiles: [cdc, full]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: rio-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      # Single broker; stated here rather than relying on the image's properties file.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "127.0.0.1:8083:8083"   # REST API
    healthcheck:
      # 200 only once the worker has completed startup; the REST port opens, and answers 404 here, earlier.
      # Connect logs every request, so after the first success this runs every 30 s, not every 2 s.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/health"]
      start_period: 120s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  rio-backend:
    build: ./backend
    profiles: [full]
    depends_on:
      postgres-rio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres-rio:5432/rio
      DB_USER: rio
      DB_PASSWORD: rio
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # A TCP connect, not an HTTP request, which the backend would log every time. main() opens the port
      # only after the schema check and seeding, so an open port means it is ready.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  postgres-rio-data:
  kafka-data:
