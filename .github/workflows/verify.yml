# Runs ./verify.sh — the same script contributors run locally — on every pull request
# and on pushes to main. The verification logic lives in the script, not here.
name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify-matrix:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Spans the range documented in frontend/package.json ("^20.19.0 || >=22.12.0").
        node: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v5

      # The Gradle toolchain pins JDK 25 (backend/build.gradle.kts), so it does not vary.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Backend tests (real Ktor pipeline, temporary SQLite files), frontend tests,
      # typecheck and production build. No external services and no secrets.
      - run: ./verify.sh

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-node-${{ matrix.node }}
          path: |
            backend/build/reports/tests
            backend/build/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Stable check name for branch protection: one required check that stays correct
  # however the Node matrix above changes.
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: verify-matrix
    if: always()
    steps:
      - name: Check matrix result
        env:
          RESULT: ${{ needs.verify-matrix.result }}
        run: |
          echo "verify-matrix result: $RESULT"
          test "$RESULT" = success
