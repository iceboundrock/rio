# Runs ./verify.sh — the same script contributors run locally — on every pull request
# and on pushes to main. The verification logic lives in the script, not here.
name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify-matrix:
    name: verify (jdk ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current release plus the LTS releases still in support. The backend is the only
        # thing that runs on a JVM, so this is the only axis worth varying.
        jdk: ['25', '21', '17']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: gradle/actions/setup-gradle@v6

      # Node only runs the frontend toolchain (vitest, tsc, vite); the React app itself never
      # executes on Node, so a single version is enough. Pin it to the exact floor of the
      # `engines.node` range in frontend/package.json so a newer-than-floor Node API sneaking
      # into the build or test setup fails here; local development on a newer Node covers the
      # other end. It has to be the exact version: a wildcard such as '24.x' resolves to the
      # newest 24 release, which is not the floor. Move this pin whenever the range moves.
      # pnpm/setup installs that Node alongside the pnpm version pinned by `packageManager` in
      # frontend/package.json and caches the pnpm store keyed on frontend/pnpm-lock.yaml. The
      # action's own `pnpm install` is off because ./verify.sh runs it.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24.21.0
          package-json-file: frontend/package.json
          install: false
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Backend tests (real Ktor pipeline, temporary SQLite files, and PostgreSQL in a container
      # that Testcontainers starts on the runner's Docker daemon, which ubuntu-latest provides),
      # frontend tests, typecheck and production build. No service containers and no secrets.
      # ORG_GRADLE_PROJECT_jdkVersion overrides the toolchain pin in backend/build.gradle.kts.
      - run: ./verify.sh
        env:
          ORG_GRADLE_PROJECT_jdkVersion: ${{ matrix.jdk }}

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-jdk-${{ matrix.jdk }}
          path: |
            backend/build/reports/tests
            backend/build/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Stable check name for branch protection: one required check that stays correct
  # however the JDK matrix above changes.
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: verify-matrix
    if: always()
    steps:
      - name: Check matrix result
        env:
          RESULT: ${{ needs.verify-matrix.result }}
        run: |
          echo "verify-matrix result: $RESULT"
          test "$RESULT" = success
